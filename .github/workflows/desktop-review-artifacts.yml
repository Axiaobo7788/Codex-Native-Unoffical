name: Desktop review artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-review-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Review artifact (${{ matrix.platform }}-${{ matrix.architecture }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            architecture: x64
            os: ubuntu-22.04
            bundle: build/linux/x64/release/bundle
          - platform: windows
            architecture: x64
            os: windows-2022
            bundle: build/windows/x64/runner/Release
          - platform: macos
            architecture: arm64
            os: macos-15
            bundle: build/macos/Build/Products/Release/codex_native_unofficial.app

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libsecret-1-dev ninja-build

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.1
          channel: stable
          architecture: ${{ matrix.architecture }}
          cache: false

      - name: Select the declared Rust MSRV
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0

      - run: flutter pub get
      - run: dart run tool/verify_native_license_packaging.dart
      - run: flutter build ${{ matrix.platform }} --release

      - name: Assemble and self-verify the review artifact
        run: >-
          dart run tool/assemble_desktop_review_artifact.dart
          --bundle "${{ matrix.bundle }}"
          --output build/review-artifacts
          --platform "${{ matrix.platform }}"
          --architecture "${{ matrix.architecture }}"
          --source-revision "${{ github.sha }}"
          --source-tree-state clean
          --flutter-version 3.47.1
          --rust-version 1.89.0
          --build-origin "github-actions:${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}"

      - name: Verify the assembled archive independently
        run: dart run tool/verify_desktop_review_artifact.dart --directory build/review-artifacts

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-native-unofficial-${{ matrix.platform }}-${{ matrix.architecture }}-review-only
          path: |
            build/review-artifacts/*.tar.gz
            build/review-artifacts/*.tar.gz.sha256
            build/review-artifacts/*.provenance.json
          if-no-files-found: error
          retention-days: 14
