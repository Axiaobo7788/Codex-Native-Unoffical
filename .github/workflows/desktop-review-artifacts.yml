name: Desktop review artifacts

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-review-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Review artifact (${{ matrix.platform }}-${{ matrix.artifact_architecture }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            architecture: x64
            artifact_architecture: x64
            os: ubuntu-22.04
            bundle: build/linux/x64/release/bundle
          - platform: windows
            architecture: x64
            artifact_architecture: x64
            os: windows-2022
            bundle: build/windows/x64/runner/Release
          - platform: macos
            architecture: arm64
            artifact_architecture: universal
            os: macos-15
            bundle: build/macos/Build/Products/Release/codex_native_unofficial.app

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y binutils libgtk-3-dev libsecret-1-dev ninja-build

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.47.1
          channel: stable
          architecture: ${{ matrix.architecture }}
          cache: false

      - name: Select the declared Rust MSRV
        run: |
          rustup toolchain install 1.89.0 --profile minimal
          rustup default 1.89.0

      - name: Install macOS universal Host targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - run: flutter pub get
      - run: dart run tool/verify_native_license_packaging.dart
      - run: flutter build ${{ matrix.platform }} --release

      - name: Assemble and self-verify the review artifact
        run: >-
          dart run tool/assemble_desktop_review_artifact.dart
          --bundle "${{ matrix.bundle }}"
          --output build/review-artifacts
          --platform "${{ matrix.platform }}"
          --architecture "${{ matrix.artifact_architecture }}"
          --source-revision "${{ github.sha }}"
          --source-tree-state clean
          --flutter-version 3.47.1
          --rust-version 1.89.0
          --build-origin "github-actions:${{ github.repository }}:${{ github.run_id }}:${{ github.run_attempt }}"

      - name: Verify the assembled archive independently
        run: >-
          dart run tool/verify_desktop_review_artifact.dart
          --directory build/review-artifacts
          --native-runtime

      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: codex-native-unofficial-${{ matrix.platform }}-${{ matrix.artifact_architecture }}-review-only
          path: |
            build/review-artifacts/*.tar.gz
            build/review-artifacts/*.tar.gz.sha256
            build/review-artifacts/*.provenance.json
          if-no-files-found: error
          retention-days: 14

  linux-clean-runtime:
    name: Linux clean runtime (ubuntu-22.04)
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    container:
      image: ubuntu:22.04@sha256:076e7bf82319619f28dd0aa9c02ab34b055ad37100395b4f49a2ffba04fb5e11
    defaults:
      run:
        shell: bash

    steps:
      - name: Install declared Linux runtime dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: >-
          apt-get update && apt-get install -y --no-install-recommends
          ca-certificates dbus-x11 libblkid1 libegl1 libgl1 libgl1-mesa-dri
          libgles2 libglx-mesa0 libgtk-3-0 liblzma5 libsecret-1-0 procps tar
          xauth xvfb

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: codex-native-unofficial-linux-x64-review-only
          path: /review-artifact

      - name: Verify the extracted app in the clean runtime image
        run: |
          set -euo pipefail
          mapfile -t archives < <(find /review-artifact -maxdepth 1 -type f -name '*.tar.gz')
          if [[ ${#archives[@]} -ne 1 ]]; then
            echo 'Expected exactly one Linux review archive.' >&2
            exit 1
          fi
          archive=${archives[0]}
          (
            cd /review-artifact
            sha256sum -c -- "$(basename "$archive").sha256"
          )
          mkdir -p /opt/codex-native-review
          tar -xzf "$archive" -C /opt/codex-native-review
          mapfile -t payloads < <(
            find /opt/codex-native-review -mindepth 2 -maxdepth 2 \
              -type d -name payload
          )
          if [[ ${#payloads[@]} -ne 1 ]]; then
            echo 'Expected exactly one extracted payload directory.' >&2
            exit 1
          fi
          payload=${payloads[0]}
          for executable in codex_native_unofficial codex-native-host; do
            dependency_report=$(ldd "$payload/$executable" 2>&1)
            if grep -Eq '=>[[:space:]]+not found([[:space:]]|$)' \
              <<<"$dependency_report"; then
              printf '%s\n' "$dependency_report" >&2
              exit 1
            fi
          done
          "$payload/codex-native-host" --help
          mkdir -p /tmp/runtime-home /tmp/runtime-cache /tmp/runtime-config
          set +e
          HOME=/tmp/runtime-home \
          XDG_CACHE_HOME=/tmp/runtime-cache \
          XDG_CONFIG_HOME=/tmp/runtime-config \
          LIBGL_ALWAYS_SOFTWARE=1 \
            timeout --kill-after=3s 8s \
            dbus-run-session -- \
            xvfb-run -a -s '-screen 0 1280x720x24' \
            "$payload/codex_native_unofficial" \
            >/tmp/codex-native-gui.log 2>&1
          gui_status=$?
          set -e
          if [[ $gui_status -ne 124 ]]; then
            echo "GUI exited before the bounded smoke window: $gui_status" >&2
            tail -n 80 /tmp/codex-native-gui.log >&2
            exit 1
          fi
          for _ in {1..20}; do
            if ! pgrep -f '/codex_native_unofficial([[:space:]]|$)' \
                 >/dev/null && \
               ! pgrep -f '/codex-native-host([[:space:]]|$)' >/dev/null; then
              break
            fi
            sleep 0.1
          done
          if pgrep -f '/codex_native_unofficial([[:space:]]|$)' >/dev/null || \
             pgrep -f '/codex-native-host([[:space:]]|$)' >/dev/null; then
            echo 'GUI smoke left a product process alive.' >&2
            ps -ef >&2
            exit 1
          fi
          echo 'LINUX_CLEAN_RUNTIME=PASS'
