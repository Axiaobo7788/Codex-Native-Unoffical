[package]
name = "codex-native-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0"
description = "Bounded transport host for Codex Native (Unofficial)"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws"] }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls"] }
base64 = "0.22.1"
dirs = "6.0.0"
fs2 = "0.4.3"
getrandom = "0.4.3"
json-skimmer = "=1.0.0"
pem = "3.0.6"
rustls = { version = "0.23.43", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "=0.11.0"
subtle = "2.6.1"
tokio = { version = "1.54.1", features = ["net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.18.1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.177"

[dev-dependencies]
rcgen = "=0.14.5"
tempfile = "3.23.0"
tungstenite = { version = "0.29.0", features = ["rustls-tls-webpki-roots"] }
